name: Dependabot backlog scanner (Devin)

# Reads the *real upstream* Dependabot backlog and ignore-list, then files one
# de-duplicated remediation issue per stuck upstream PR and one "unblock" issue
# per pinned ignore-list dependency. When the DEVIN_API_KEY / DEVIN_ORG_ID
# secrets are present, each newly filed issue also starts a Devin session via
# the v3 API so the orchestrator picks the work up immediately.
#
# Required repository secrets (Settings > Secrets and variables > Actions):
#   DEVIN_API_KEY  - service-user token with the ManageOrgSessions permission
#   DEVIN_ORG_ID   - organization ID (prefix: org-)
# Optional repository variables (Settings > Secrets and variables > Actions):
#   UPSTREAM_REPO       - upstream to scan (default: apache/superset)
#   STUCK_MIN_FAILURES  - failing checks needed to call a PR stuck (default: 1)
#   MAX_ISSUES_PER_RUN  - safety cap on issues filed per run (default: 10)
#   DEVIN_MAX_ACU       - per-session ACU cap for triggered sessions (optional)

on:
  schedule:
    # Every 6 hours. GitHub Actions cron runs in UTC.
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List actions without filing issues or starting sessions"
        type: boolean
        default: false

concurrency:
  group: dependabot-scanner
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Scan backlog and file issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORK_REPO: ${{ github.repository }}
          UPSTREAM_REPO: ${{ vars.UPSTREAM_REPO || 'apache/superset' }}
          STUCK_MIN_FAILURES: ${{ vars.STUCK_MIN_FAILURES || '1' }}
          MAX_ISSUES_PER_RUN: ${{ vars.MAX_ISSUES_PER_RUN || '10' }}
          DEVIN_MAX_ACU: ${{ vars.DEVIN_MAX_ACU || '' }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ secrets.DEVIN_ORG_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: python .github/scripts/dependabot_scanner.py
